name: XENON Release & Multi-Platform Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          # Re-enable macOS & Linux targets once real binaries and src-tauri/icons/icon.icns
          # replace the ~70-byte placeholder stubs in src-tauri/binaries & src-tauri/resources/lib.

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & typecheck frontend
        run: npm run build

      - name: Run Rust core & integrity tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Generate SHA-256 binary integrity manifest
        run: node scripts/generate-integrity-manifest.mjs

      - name: Build Tauri installers (${{ matrix.target }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "XENON v__VERSION__"
          releaseBody: "100% Offline Private PDF Workspace — Bundled Installers & SHA-256 Checksums"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
