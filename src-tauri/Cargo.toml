[package]
name = "xenon-pdf"
version = "1.0.0"
description = "XENON — Private PDF Workspace (Your Documents. Your Device. Your Privacy.)"
license = "AGPL-3.0-or-later"
edition = "2021"

[dependencies]
tauri = { version = "2.1", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-notification = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
parking_lot = "0.12"
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
lru = "0.12"
sysinfo = "0.32"
uuid = { version = "1.10", features = ["v4"] }
libloading = "0.7"
p12-keystore = "0.4"
cryptographic-message-syntax = "0.27"
x509-certificate = "0.24"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.13"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
